<html>


<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request a Tutoring Session</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main class="container py-5 px-3">
        <h1>Request a tutoring session</h1>
            
   
<form class="request-form row g-3" action="process-request.php" method="post">

    <div class="col-12 col-md-6">
        <label for="course" class="form-label">Course</label>
        <input id="course" name="course" class="form-control" required>
    </div>

    <div class="col-12 col-md-6">
        <label for="date" class="form-label">Preferred date</label>
        <input id="date" name="date" type="date" class="form-control" required>
    </div>

 <div class="col-12">
    <button type="submit" class="btn btn-danger">
        Request session
    </button>
</div>

</form>

    </main>
</body>

</html>
