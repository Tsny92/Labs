<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">    
</head>

<body>
    <main class="container py-5">
        <h1>Request a tutoring session</h1>

<!-- course -->
<form class="request-form" action="process-request.php" method="post">
    <div class="form-group">
        <label for="course">Course</label>
        <select id="course" name="course" class="form-control" required>
            <option value="">Select a course</option>
            <option value="IS 6465">IS 6465</option>
            <option value="IS 6495">IS 6495</option>
            <option value="IS 6570">IS 6570</option>
        </select>
    </div>
		
		<!-- topic -->
		
<div class="form-group">
    <label for="topic">What do you need help with?</label>
    <input
        type="text"
        id="topic"
        name="topic"
        class="form-control"
        maxlength="120"
        required
    >
</div>
		
<!-- preferred date -->
<div class="form-group">
    <label for="preferreddate">Preferred Date</label>
    <input
        type="date"
        id="preferreddate"
        name="preferreddate"
        class="form-control"
        required
    >
</div>

		
<!-- preferred time -->
<div class="form-group">
    <label for="preferredtime">Preferred Time</label>
    <select id="preferredtime" name="preferredtime" class="form-control" required>
        <option value="">Select a preferred time</option>
        <option value="Morning">Morning</option>
        <option value="Afternoon">Afternoon</option>
        <option value="Evening">Evening</option>
    </select>
</div>

<button class="btn btn-danger" type="submit">Request session</button>
        </form>
    </main>
</body>

</html>
